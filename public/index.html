<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>텀블러 공장 제조품질관리</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19342d;
        background: #f2f6f3;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        min-height: 76px;
        box-sizing: border-box;
        width: 100%;
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        background: #fff;
        border-bottom: 1px solid #d8e3dc;
      }

      .brand-link,
      .header-actions,
      .header-actions nav {
        display: flex;
        align-items: center;
      }

      .brand-link {
        gap: 12px;
        color: inherit;
        font-size: 20px;
        font-weight: 750;
        text-decoration: none;
      }

      .brand-link img {
        width: 44px;
        height: 44px;
      }

      .header-actions {
        gap: 22px;
      }

      .header-actions nav {
        gap: 20px;
      }

      .header-actions a {
        color: #276447;
        font-weight: 650;
      }

      .header-user {
        color: #40584d;
        white-space: nowrap;
      }

      .logout-button {
        width: auto;
        margin: 0;
        padding: 9px 14px;
      }

      [hidden] {
        display: none !important;
      }

      .yellow-notice {
        box-sizing: border-box;
        width: 100%;
        padding: 14px 32px;
        color: #624b0b;
        background: #fff3bf;
      }

      .page-content {
        flex: 1;
        width: 100%;
        display: grid;
        place-items: center;
      }

      #app-screen {
        width: min(100% - 48px, 1100px);
        padding: 48px 0;
      }

      #app-screen h1 {
        margin-bottom: 0;
      }

      .screen-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .screen-heading h1 {
        margin-bottom: 0;
      }

      .primary-button {
        width: auto;
        margin: 0;
        padding: 10px 16px;
      }

      .screen-view {
        margin-top: 24px;
      }

      .home-date {
        display: block;
        max-width: 280px;
        margin: 0 0 8px;
      }

      .home-date-input {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        padding: 9px 11px;
        border: 1px solid #bdcec3;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .home-summary-cards {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .home-summary-card {
        min-height: 96px;
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        border: 1px solid #d8e3dc;
        border-radius: 12px;
        background: #fff;
        color: #19342d;
        text-align: left;
        cursor: pointer;
      }

      .home-summary-card[aria-pressed="true"] {
        border: 3px solid #276447;
        background: #e4f1e9;
      }

      .home-summary-card span {
        color: #52665b;
        font-size: 14px;
        font-weight: 650;
      }

      .home-summary-card strong {
        font-size: 28px;
        line-height: 1;
      }

      .home-list-message {
        margin: 18px 0 0;
        color: #52665b;
      }

      .home-inspection-list {
        margin-top: 20px;
        display: grid;
        gap: 12px;
      }

      .home-inspection-card {
        width: 100%;
        margin: 0;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        border: 1px solid #d8e3dc;
        border-radius: 12px;
        background: #fff;
        color: #19342d;
        text-align: left;
      }

      .home-inspection-card > img,
      .home-inspection-card > .no-photo {
        flex: 0 0 92px;
        width: 92px;
        height: 92px;
        border-radius: 8px;
      }

      .home-inspection-card > img {
        object-fit: cover;
      }

      .home-inspection-card > .no-photo {
        display: grid;
        place-items: center;
        background: #f2f6f3;
        color: #52665b;
        font-size: 13px;
      }

      .home-inspection-details {
        min-width: 0;
        display: grid;
        gap: 5px;
        overflow-wrap: anywhere;
      }

      .inspection-form {
        width: min(100%, 560px);
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .inspection-form select,
      .inspection-form input,
      .inspection-form textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #bdcec3;
        border-radius: 9px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .inspection-form textarea {
        min-height: 100px;
        resize: vertical;
      }

      .image-previews {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .image-previews img {
        width: 92px;
        height: 92px;
        object-fit: cover;
        border: 1px solid #d8e3dc;
        border-radius: 8px;
      }

      .weight-range {
        margin: 4px 0 0;
        color: #40584d;
        font-weight: 650;
      }

      .inspection-detail-error {
        color: #b42318;
        font-weight: 650;
      }

      .inspection-summary {
        margin-bottom: 24px;
        padding: 20px 24px;
        border: 1px solid #d8e3dc;
        border-radius: 14px;
        background: #fff;
      }

      .inspection-summary p {
        margin: 6px 0;
      }

      .inspection-summary strong {
        color: #19342d;
      }

      .inspection-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 1px solid #bdcec3;
      }

      .inspection-tab {
        width: auto;
        margin: 0;
        padding: 12px 16px;
        border-radius: 9px 9px 0 0;
        background: #e5eee8;
        color: #19342d;
      }

      .inspection-tab[aria-selected="true"] {
        background: #276447;
        color: #fff;
      }

      .inspection-tab-panel {
        min-height: 140px;
        padding: 24px;
        border: 1px solid #d8e3dc;
        border-top: 0;
        border-radius: 0 0 12px 12px;
        background: #fff;
      }

      .inspection-tab-panel p {
        margin: 0;
      }

      .inspection-detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 28px;
        align-items: start;
      }

      .detail-main-image {
        min-height: 300px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid #d8e3dc;
        border-radius: 12px;
        background: #f2f6f3;
        color: #52665b;
      }

      .detail-main-image img {
        display: block;
        max-width: 100%;
        max-height: 520px;
        object-fit: contain;
      }

      .detail-thumbnails {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .detail-thumbnails button {
        width: 76px;
        height: 76px;
        margin: 0;
        padding: 3px;
        border: 2px solid transparent;
        background: #fff;
      }

      .detail-thumbnails button[aria-current="true"] {
        border-color: #276447;
      }

      .detail-thumbnails img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .detail-values {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px 18px;
      }

      .detail-values dt {
        color: #52665b;
        font-weight: 650;
      }

      .detail-values dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .detail-edit {
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #d8e3dc;
        display: grid;
        gap: 10px;
      }

      .detail-edit label {
        margin: 4px 0 0;
        font-weight: 650;
      }

      .detail-edit select,
      .detail-edit input {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        padding: 9px 11px;
        border: 1px solid #bdcec3;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      .detail-edit button {
        width: auto;
        margin: 8px 0 0;
      }

      #not-found-view p {
        margin: 0 0 18px;
      }

      #not-found-view a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        color: #fff;
        background: #276447;
        font-weight: 700;
        text-decoration: none;
      }

      .app-footer {
        padding: 18px 24px;
        color: #52665b;
        text-align: center;
        background: #fff;
        border-top: 1px solid #d8e3dc;
      }

      .login-box {
        width: min(100% - 40px, 420px);
        box-sizing: border-box;
        padding: 36px;
        border: 1px solid #d8e3dc;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(25 52 45 / 8%);
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
        line-height: 1.35;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        margin-top: 6px;
        font-weight: 650;
      }

      input,
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 48px;
        border-radius: 9px;
        font: inherit;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #bdcec3;
        background: #fff;
      }

      button {
        margin-top: 12px;
        border: 0;
        background: #276447;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .logout-button:disabled {
        cursor: not-allowed;
      }

      .error-message {
        margin: 4px 0 0;
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <a class="brand-link" href="/" data-link aria-label="텀블러 공장 제조품질관리 홈">
        <img src="/logo.svg" alt="" />
        <span>텀블러 공장 제조품질관리</span>
      </a>
      <div id="header-actions" class="header-actions" hidden>
        <nav aria-label="주요 메뉴">
          <a href="/settings" data-link>설정</a>
          <span id="header-user" class="header-user"></span>
        </nav>
        <button id="logout-button" class="logout-button" type="button">로그아웃</button>
      </div>
    </header>

    <aside id="yellow-notice" class="yellow-notice" hidden>
      AI 분석 결과는 보조 자료이며 품질 담당자의 확인이 필요합니다. 최종 출하 승인은 현장 기준에 따라 별도로 진행하세요.
    </aside>

    <div class="page-content">
      <main id="login-box" class="login-box">
        <h1>텀블러 공장 제조품질관리</h1>
        <form id="login-form">
          <label for="username">계정</label>
          <input
            id="username"
            name="username"
            value="writer"
            autocomplete="username"
            required
          />

          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            value="writer1234!"
            autocomplete="current-password"
            required
          />

          <button id="login-button" type="button">로그인</button>
          <p id="login-error" class="error-message" role="alert" hidden></p>
        </form>
      </main>

      <main id="app-screen" hidden>
        <div class="screen-heading">
          <h1 id="screen-title">품질 현황</h1>
          <button id="new-inspection-link" class="primary-button" type="button" data-route="/inspections/new" hidden>
            사진 등록
          </button>
        </div>
        <section id="home-view" class="screen-view" hidden>
          <label class="home-date" for="home-date">날짜</label>
          <input id="home-date" class="home-date-input" type="date" />
          <p id="home-summary-error" class="error-message" role="alert" hidden></p>
          <div class="home-summary-cards" aria-live="polite">
            <button type="button" class="home-summary-card" data-home-filter="all" aria-pressed="false"><span>검사 건수</span><strong id="home-total">0</strong></button>
            <button type="button" class="home-summary-card" data-home-filter="NG" aria-pressed="false"><span>NG 건수</span><strong id="home-ng">0</strong></button>
            <button type="button" class="home-summary-card" data-home-filter="HOLD" aria-pressed="false"><span>HOLD 건수</span><strong id="home-hold">0</strong></button>
            <button type="button" class="home-summary-card" data-home-filter="review-pending" aria-pressed="false"><span>보고서 검토 대기</span><strong id="home-review-pending">0</strong></button>
          </div>
          <p id="home-list-error" class="error-message" role="alert" hidden></p>
          <div id="home-inspection-list" class="home-inspection-list" aria-live="polite"></div>
        </section>
        <section id="settings-view" class="screen-view" hidden>
          <h2>저장소 상태</h2>
          <p id="storage-status" role="status">저장소 상태를 불러오는 중입니다.</p>
        </section>
        <section id="inspection-new-view" class="screen-view" hidden>
          <form id="inspection-fields" class="inspection-form">
            <label for="inspection-product">제품</label>
            <select id="inspection-product" name="product_id" required>
              <option value="P-SILVER">은색 텀블러</option>
              <option value="P-WHITE">흰색 텀블러</option>
              <option value="P-BLACK">검정 텀블러</option>
            </select>

            <label for="inspection-date">검사일시</label>
            <input id="inspection-date" name="inspected_at" type="datetime-local" step="1" required />

            <label for="inspection-revision">검사기준</label>
            <select id="inspection-revision" name="revision">
              <option value="Rev.A">Rev.A</option>
              <option value="Rev.B">Rev.B</option>
            </select>

            <label for="inspection-weight">중량(g)</label>
            <input id="inspection-weight" name="weight_g" type="number" step="any" />

            <label for="inspection-memo">메모</label>
            <textarea id="inspection-memo" name="memo"></textarea>

            <label for="inspection-images">사진</label>
            <input id="inspection-images" name="images" type="file" accept="image/*" multiple />
            <div id="inspection-image-previews" class="image-previews" aria-live="polite"></div>

            <p id="inspection-weight-range" class="weight-range" aria-live="polite"></p>
            <button id="inspection-submit" class="primary-button" type="submit">검사 등록</button>
            <p id="inspection-submit-error" class="error-message" role="alert" hidden></p>
          </form>
        </section>
        <section id="inspection-detail-view" class="screen-view" hidden>
          <p id="inspection-detail-error" class="inspection-detail-error" role="alert" hidden></p>
          <div id="inspection-detail-content" hidden>
            <div class="inspection-summary">
              <p>검사번호: <strong id="detail-inspection-id"></strong></p>
              <p>제품: <strong id="detail-product-name"></strong></p>
              <p>판정: <strong id="detail-decision"></strong></p>
              <p id="detail-content-version"></p>
            </div>
            <div class="inspection-tabs" role="tablist" aria-label="검사 상세 내용">
              <button class="inspection-tab" id="inspection-tab-1" type="button" role="tab" aria-selected="true" aria-controls="inspection-panel-1">① 사진·측정값</button>
              <button class="inspection-tab" id="inspection-tab-2" type="button" role="tab" aria-selected="false" aria-controls="inspection-panel-2">② AI 결과 확인</button>
              <button class="inspection-tab" id="inspection-tab-3" type="button" role="tab" aria-selected="false" aria-controls="inspection-panel-3">③ 검사기준과 비교하기</button>
              <button class="inspection-tab" id="inspection-tab-4" type="button" role="tab" aria-selected="false" aria-controls="inspection-panel-4">④ 내 판단 기록</button>
            </div>
            <section id="inspection-panel-1" class="inspection-tab-panel" role="tabpanel" aria-labelledby="inspection-tab-1">
              <div class="inspection-detail-grid">
                <div>
                  <div id="detail-main-image" class="detail-main-image"></div>
                  <div id="detail-thumbnails" class="detail-thumbnails" aria-label="검사 사진"></div>
                </div>
                <dl class="detail-values">
                  <dt>제품</dt><dd id="detail-value-product"></dd>
                  <dt>검사일시</dt><dd id="detail-value-date"></dd>
                  <dt>검사기준</dt><dd id="detail-value-revision"></dd>
                  <dt>중량</dt><dd id="detail-value-weight"></dd>
                  <dt>메모</dt><dd id="detail-value-memo"></dd>
                </dl>
                <form id="detail-edit-form" class="detail-edit">
                  <label for="detail-edit-product">제품</label>
                  <select id="detail-edit-product" name="product_id" required></select>
                  <label for="detail-edit-date">검사일시</label>
                  <input id="detail-edit-date" name="inspected_at" type="datetime-local" step="1" required />
                  <label for="detail-edit-weight">중량(g)</label>
                  <input id="detail-edit-weight" name="weight_g" type="number" step="any" />
                  <button id="detail-edit-save" type="submit">저장</button>
                  <p id="detail-edit-error" class="error-message" role="alert" hidden></p>
                </form>
              </div>
            </section>
            <section id="inspection-panel-2" class="inspection-tab-panel" role="tabpanel" aria-labelledby="inspection-tab-2" hidden>
              <p>이 탭은 나중 회차에서 만듭니다.</p>
            </section>
            <section id="inspection-panel-3" class="inspection-tab-panel" role="tabpanel" aria-labelledby="inspection-tab-3" hidden>
              <p>이 탭은 나중 회차에서 만듭니다.</p>
            </section>
            <section id="inspection-panel-4" class="inspection-tab-panel" role="tabpanel" aria-labelledby="inspection-tab-4" hidden>
              <p>이 탭은 나중 회차에서 만듭니다.</p>
            </section>
          </div>
        </section>
        <section id="not-found-view" hidden>
          <p>페이지를 찾을 수 없습니다</p>
          <a href="/" data-link>홈으로 가기</a>
        </section>
      </main>
    </div>

    <footer id="app-footer" class="app-footer" hidden>텀블러 공장 품질관리 시스템입니다.</footer>

    <script>
      const loginBox = document.querySelector('#login-box');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const loginError = document.querySelector('#login-error');
      const appScreen = document.querySelector('#app-screen');
      const headerActions = document.querySelector('#header-actions');
      const headerUser = document.querySelector('#header-user');
      const logoutButton = document.querySelector('#logout-button');
      const yellowNotice = document.querySelector('#yellow-notice');
      const appFooter = document.querySelector('#app-footer');
      const screenTitle = document.querySelector('#screen-title');
      const notFoundView = document.querySelector('#not-found-view');
      const homeView = document.querySelector('#home-view');
      const settingsView = document.querySelector('#settings-view');
      const storageStatus = document.querySelector('#storage-status');
      const inspectionNewView = document.querySelector('#inspection-new-view');
      const inspectionDetailView = document.querySelector('#inspection-detail-view');
      const detailMainImage = document.querySelector('#detail-main-image');
      const detailThumbnails = document.querySelector('#detail-thumbnails');
      const detailEditForm = document.querySelector('#detail-edit-form');
      const detailEditSave = document.querySelector('#detail-edit-save');
      const detailEditError = document.querySelector('#detail-edit-error');
      const newInspectionLink = document.querySelector('#new-inspection-link');
      const homeDate = document.querySelector('#home-date');
      const homeSummaryError = document.querySelector('#home-summary-error');
      const homeListError = document.querySelector('#home-list-error');
      const homeInspectionList = document.querySelector('#home-inspection-list');
      let homeSummaryRequestId = 0;
      let homeListRequestId = 0;
      let activeHomeFilter = null;
      const inspectionImageInput = document.querySelector('#inspection-images');
      const inspectionImagePreviews = document.querySelector('#inspection-image-previews');
      const inspectionForm = document.querySelector('#inspection-fields');
      const inspectionSubmit = document.querySelector('#inspection-submit');
      const inspectionSubmitError = document.querySelector('#inspection-submit-error');
      const roleLabels = { writer: '작성자', reviewer: '검토자', 'factory-user': '품질관리' };
      let selectedImageDataUrls = [];
      let imageSelectionVersion = 0;
      let activeInspectionRequest = 0;
      let activeDetailImages = [];
      function currentKoreanDateTime() {
        const parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Seoul',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hourCycle: 'h23',
        }).formatToParts(new Date());
        const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
        return `${values.year}-${values.month}-${values.day}T${values.hour}:${values.minute}:${values.second}`;
      }

      async function loadWeightRange() {
        const productId = document.querySelector('#inspection-product').value;
        const revision = document.querySelector('#inspection-revision').value;
        const rangeLine = document.querySelector('#inspection-weight-range');
        rangeLine.textContent = '';
        try {
          const response = await fetch(`/api/standards/${revision}`);
          const standard = await response.json();
          if (!response.ok || standard.error) throw new Error(standard.error || '검사기준을 불러오지 못했습니다.');
          const range = standard.weight_g?.[productId];
          if (!range) throw new Error('중량 범위를 찾을 수 없습니다.');
          rangeLine.textContent = `기준 중량: ${range.min}~${range.max}g`;
        } catch (error) {
          rangeLine.textContent = error.message || '중량 범위를 불러오지 못했습니다.';
        }
      }

      function selectInspectionTab(tabIndex) {
        for (let index = 1; index <= 4; index += 1) {
          const selected = index === tabIndex;
          document.querySelector(`#inspection-tab-${index}`).setAttribute('aria-selected', String(selected));
          document.querySelector(`#inspection-panel-${index}`).hidden = !selected;
        }
      }

      function renderDetailImages(images) {
        activeDetailImages = images;
        detailMainImage.replaceChildren();
        detailThumbnails.replaceChildren();
        if (images.length === 0) {
          detailMainImage.textContent = '등록된 사진이 없습니다.';
          return;
        }

        images.forEach((imageUrl, index) => {
          const thumbnailButton = document.createElement('button');
          thumbnailButton.type = 'button';
          thumbnailButton.dataset.imageIndex = String(index);
          thumbnailButton.setAttribute('aria-label', `사진 ${index + 1} 크게 보기`);
          const thumbnail = document.createElement('img');
          thumbnail.src = imageUrl;
          thumbnail.alt = '';
          thumbnailButton.append(thumbnail);
          detailThumbnails.append(thumbnailButton);
        });
        showDetailImage(0);
      }

      function showDetailImage(index) {
        const imageUrl = activeDetailImages[index];
        if (!imageUrl) return;
        const image = document.createElement('img');
        image.src = imageUrl;
        image.alt = `검사 사진 ${index + 1}`;
        detailMainImage.replaceChildren(image);
        [...detailThumbnails.querySelectorAll('button')].forEach((button, buttonIndex) => {
          button.setAttribute('aria-current', String(buttonIndex === index));
        });
      }

      detailThumbnails.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-image-index]');
        if (button) showDetailImage(Number(button.dataset.imageIndex));
      });

      async function populateDetailProductOptions(selectedProductId) {
        const select = document.querySelector('#detail-edit-product');
        const response = await fetch('/api/products');
        const products = await response.json();
        if (!response.ok || products.error) {
          throw new Error(products.error || '제품 목록을 불러오지 못했습니다.');
        }
        select.replaceChildren(...products.map((product) => {
          const option = document.createElement('option');
          option.value = product.product_id;
          option.textContent = product.label;
          return option;
        }));
        select.value = selectedProductId;
      }

      detailEditForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        detailEditError.hidden = true;
        if (!detailEditForm.reportValidity()) return;

        detailEditSave.disabled = true;
        const dateValue = document.querySelector('#detail-edit-date').value;
        const weightValue = document.querySelector('#detail-edit-weight').value;
        try {
          const response = await fetch(`/api${window.location.pathname}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              product_id: document.querySelector('#detail-edit-product').value,
              inspected_at: `${dateValue.replace('T', ' ')}${dateValue.length === 16 ? ':00' : ''}`,
              weight_g: weightValue === '' ? null : Number(weightValue),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '저장하지 못했습니다.');
          }
          await loadInspectionDetail();
        } catch (error) {
          detailEditError.textContent = error.message || '저장하지 못했습니다.';
          detailEditError.hidden = false;
        } finally {
          detailEditSave.disabled = false;
        }
      });

      async function loadInspectionDetail() {
        const requestId = ++activeInspectionRequest;
        const errorMessage = document.querySelector('#inspection-detail-error');
        const content = document.querySelector('#inspection-detail-content');
        errorMessage.hidden = true;
        content.hidden = true;
        try {
          const response = await fetch(`/api${window.location.pathname}`);
          const inspection = await response.json();
          if (!response.ok || inspection.error) {
            throw new Error(inspection.error || '검사를 불러오지 못했습니다.');
          }
          if (requestId !== activeInspectionRequest) return;
          const productNames = {
            'P-SILVER': '텀블러 실버',
            'P-WHITE': '텀블러 화이트',
            'P-BLACK': '텀블러 블랙',
          };
          document.querySelector('#detail-inspection-id').textContent = inspection.inspection_id;
          document.querySelector('#detail-product-name').textContent = productNames[inspection.product_id] || inspection.product_id;
          document.querySelector('#detail-decision').textContent = inspection.decision || '미판정';
          document.querySelector('#detail-content-version').textContent = `검사 기록 버전: ${inspection.content_version}`;
          document.querySelector('#detail-value-product').textContent = productNames[inspection.product_id] || inspection.product_id;
          document.querySelector('#detail-value-date').textContent = inspection.inspected_at;
          document.querySelector('#detail-value-revision').textContent = inspection.revision;
          document.querySelector('#detail-value-weight').textContent = inspection.weight_g === null ? '미측정' : `${inspection.weight_g}g`;
          document.querySelector('#detail-value-memo').textContent = inspection.memo || '없음';
          await populateDetailProductOptions(inspection.product_id);
          document.querySelector('#detail-edit-date').value = inspection.inspected_at.replace(' ', 'T');
          document.querySelector('#detail-edit-weight').value = inspection.weight_g ?? '';
          detailEditError.hidden = true;
          renderDetailImages(Array.isArray(inspection.images) ? inspection.images : []);
          selectInspectionTab(1);
          content.hidden = false;
        } catch (error) {
          if (requestId !== activeInspectionRequest) return;
          errorMessage.textContent = error.message || '검사를 불러오지 못했습니다.';
          errorMessage.hidden = false;
        }
      }

      function initializeInspectionForm() {
        document.querySelector('#inspection-date').value = currentKoreanDateTime();
        document.querySelector('#inspection-revision').value = 'Rev.A';
        document.querySelector('#inspection-weight').value = '';
        document.querySelector('#inspection-memo').value = '';
        inspectionImageInput.value = '';
        inspectionImagePreviews.replaceChildren();
        selectedImageDataUrls = [];
        imageSelectionVersion += 1;
        void loadWeightRange();
      }

      function readImageAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('사진을 읽지 못했습니다.'));
          reader.readAsDataURL(file);
        });
      }

      function renderScreen() {
        const route = window.location.pathname;
        homeView.hidden = true;
        settingsView.hidden = true;
        inspectionNewView.hidden = true;
        inspectionDetailView.hidden = true;
        newInspectionLink.hidden = true;
        let title = '품질 현황';
        if (route === '/inspections/new') {
          title = '검사 등록';
          inspectionNewView.hidden = false;
          initializeInspectionForm();
        } else if (route === '/') {
          homeView.hidden = false;
          newInspectionLink.hidden = false;
          void loadHomeSummary();
        } else if (route === '/settings') {
          title = '설정';
          settingsView.hidden = false;
          void loadStorageStatus();
        } else if (/^\/inspections\/[^/]+$/.test(route)) {
          title = '검사 상세';
          inspectionDetailView.hidden = false;
          void loadInspectionDetail();
        } else if (route === '/settings') title = '설정';
        else if (route !== '/') {
          screenTitle.hidden = true;
          notFoundView.hidden = false;
          return;
        }

        screenTitle.textContent = title;
        screenTitle.hidden = false;
        notFoundView.hidden = true;
      }

      function navigate(path) {
        if (window.location.pathname !== path) history.pushState({}, '', path);
        renderScreen();
      }

      function showApp(user) {
        loginBox.hidden = true;
        appScreen.hidden = false;
        yellowNotice.hidden = false;
        appFooter.hidden = false;
        headerActions.hidden = false;
        headerUser.textContent = `${user.username} (${roleLabels[user.role] || user.role})`;
        renderScreen();
      }

      async function loadHomeSummary() {
        const requestId = ++homeSummaryRequestId;
        homeSummaryError.hidden = true;
        const query = homeDate.value ? `?date=${encodeURIComponent(homeDate.value)}` : '';
        try {
          const response = await fetch(`/api/home${query}`);
          const summary = await response.json();
          if (!response.ok || summary.error) {
            throw new Error(summary.error || '하루 현황을 불러오지 못했습니다.');
          }
          if (requestId !== homeSummaryRequestId) return;
          document.querySelector('#home-total').textContent = summary.total;
          document.querySelector('#home-ng').textContent = summary.ng;
          document.querySelector('#home-hold').textContent = summary.hold;
          document.querySelector('#home-review-pending').textContent = summary.review_pending;
          homeDate.value = summary.date || '';
          void loadHomeInspections(summary.date || '');
        } catch (error) {
          if (requestId !== homeSummaryRequestId) return;
          homeSummaryError.textContent = error.message || '하루 현황을 불러오지 못했습니다.';
          homeSummaryError.hidden = false;
        }
      }

      async function loadStorageStatus() {
        storageStatus.textContent = '저장소 상태를 불러오는 중입니다.';
        try {
          const response = await fetch('/api/operations');
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '저장소 상태를 불러오지 못했습니다.');
          }
          storageStatus.textContent = `저장소: ${result.label}`;
        } catch (error) {
          storageStatus.textContent = error.message || '저장소 상태를 불러오지 못했습니다.';
        }
      }

      async function loadHomeInspections(date) {
        const requestId = ++homeListRequestId;
        homeListError.hidden = true;
        const params = new URLSearchParams();
        if (date) params.set('date', date);
        if (activeHomeFilter === 'NG' || activeHomeFilter === 'HOLD') {
          params.set('decision', activeHomeFilter);
        } else if (activeHomeFilter === 'review-pending') {
          params.set('review', 'pending');
        }
        const query = params.toString();
        try {
          const response = await fetch(`/api/inspections${query ? `?${query}` : ''}`);
          const inspections = await response.json();
          if (!response.ok || inspections.error) {
            throw new Error(inspections.error || '검사 목록을 불러오지 못했습니다.');
          }
          if (requestId !== homeListRequestId) return;
          renderHomeInspections(inspections);
        } catch (error) {
          if (requestId !== homeListRequestId) return;
          homeInspectionList.replaceChildren();
          homeListError.textContent = error.message || '검사 목록을 불러오지 못했습니다.';
          homeListError.hidden = false;
        }
      }

      function renderHomeInspections(inspections) {
        homeInspectionList.replaceChildren();
        if (inspections.length === 0) {
          const message = document.createElement('p');
          message.className = 'home-list-message';
          message.textContent = activeHomeFilter
            ? '이 날짜에 이 종류의 검사가 없습니다.'
            : '이 날짜에 등록한 검사가 없습니다.';
          homeInspectionList.append(message);
          return;
        }

        const productNames = {
          'P-SILVER': '텀블러 실버',
          'P-WHITE': '텀블러 화이트',
          'P-BLACK': '텀블러 블랙',
        };
        const decisionLabels = { OK: '정상', NG: '불량', HOLD: '보류' };
        inspections.forEach((inspection) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'home-inspection-card';
          card.dataset.inspectionId = inspection.inspection_id;

          if (inspection.images?.[0]) {
            const image = document.createElement('img');
            image.src = inspection.images[0];
            image.alt = '검사 사진';
            card.append(image);
          } else {
            const placeholder = document.createElement('span');
            placeholder.className = 'no-photo';
            placeholder.textContent = '사진 없음';
            card.append(placeholder);
          }

          const details = document.createElement('span');
          details.className = 'home-inspection-details';
          const id = document.createElement('strong');
          id.textContent = inspection.inspection_id;
          const product = document.createElement('span');
          product.textContent = productNames[inspection.product_id] || inspection.product_id;
          const weight = document.createElement('span');
          weight.textContent = inspection.weight_g === null ? '미측정' : `${inspection.weight_g}g`;
          const decision = document.createElement('span');
          decision.textContent = decisionLabels[inspection.decision] || '미판정';
          details.append(id, product, weight, decision);
          card.append(details);
          homeInspectionList.append(card);
        });
      }

      function showLoginError(message) {
        loginError.textContent = message;
        loginError.hidden = false;
      }

      async function submitLogin() {
        if (loginButton.disabled) return;
        loginError.hidden = true;
        loginButton.disabled = true;

        const formData = new FormData(loginForm);
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: formData.get('username'),
              password: formData.get('password'),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            showLoginError(result.error || '로그인 정보를 확인하세요.');
            return;
          }
          showApp(result.user);
        } catch (error) {
          showLoginError(error.message || '서버와 통신할 수 없습니다.');
        } finally {
          loginButton.disabled = false;
        }
      }

      async function checkLogin() {
        try {
          const response = await fetch('/api/session');
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || '로그인 상태를 확인하지 못했습니다.');
          }
          if (result.user) showApp(result.user);
        } catch (error) {
          showLoginError(error.message || '로그인 상태를 확인하지 못했습니다.');
        }
      }

      loginButton.addEventListener('click', (event) => {
        event.preventDefault();
        if (!loginForm.reportValidity()) return;
        void submitLogin();
      });

      document.querySelector('#inspection-product').addEventListener('change', loadWeightRange);
      document.querySelector('#inspection-revision').addEventListener('change', loadWeightRange);
      homeDate.addEventListener('change', loadHomeSummary);
      document.querySelectorAll('[data-home-filter]').forEach((card) => {
        card.addEventListener('click', () => {
          const selected = card.dataset.homeFilter;
          if (selected === 'all') activeHomeFilter = null;
          else activeHomeFilter = activeHomeFilter === selected ? null : selected;
          document.querySelectorAll('[data-home-filter]').forEach((filterCard) => {
            filterCard.setAttribute('aria-pressed', String(filterCard.dataset.homeFilter === activeHomeFilter));
          });
          void loadHomeInspections(homeDate.value);
        });
      });
      homeInspectionList.addEventListener('click', (event) => {
        const card = event.target.closest('button[data-inspection-id]');
        if (card) navigate(`/inspections/${encodeURIComponent(card.dataset.inspectionId)}`);
      });
      for (let tabIndex = 1; tabIndex <= 4; tabIndex += 1) {
        document.querySelector(`#inspection-tab-${tabIndex}`).addEventListener('click', () => {
          selectInspectionTab(tabIndex);
        });
      }
      inspectionImageInput.addEventListener('change', async () => {
        const selectionVersion = ++imageSelectionVersion;
        selectedImageDataUrls = [];
        inspectionImagePreviews.replaceChildren();
        const files = [...inspectionImageInput.files];
        try {
          const dataUrls = await Promise.all(files.map(readImageAsDataUrl));
          if (selectionVersion !== imageSelectionVersion) return;
          selectedImageDataUrls = dataUrls;
          dataUrls.forEach((dataUrl) => {
            const image = document.createElement('img');
            image.src = dataUrl;
            image.alt = '고른 사진 미리 보기';
            inspectionImagePreviews.append(image);
          });
        } catch (error) {
          if (selectionVersion !== imageSelectionVersion) return;
          inspectionImagePreviews.replaceChildren();
          selectedImageDataUrls = [];
          const message = document.createElement('p');
          message.className = 'error-message';
          message.textContent = error.message || '사진을 읽지 못했습니다.';
          inspectionImagePreviews.append(message);
        }
      });

      inspectionForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        inspectionSubmitError.hidden = true;
        if (!inspectionForm.reportValidity()) return;
        if (selectedImageDataUrls.length === 0) {
          inspectionSubmitError.textContent = '사진을 골라 주세요.';
          inspectionSubmitError.hidden = false;
          return;
        }

        inspectionSubmit.disabled = true;
        const weightValue = document.querySelector('#inspection-weight').value;
        const dateValue = document.querySelector('#inspection-date').value;
        const payload = {
          product_id: document.querySelector('#inspection-product').value,
          inspected_at: `${dateValue.replace('T', ' ')}${dateValue.length === 16 ? ':00' : ''}`,
          revision: document.querySelector('#inspection-revision').value,
          weight_g: weightValue === '' ? null : Number(weightValue),
          memo: document.querySelector('#inspection-memo').value,
          images: selectedImageDataUrls,
        };

        try {
          const response = await fetch('/api/inspections', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '검사를 등록하지 못했습니다.');
          }
          navigate(`/inspections/${encodeURIComponent(result.inspection_id)}`);
        } catch (error) {
          inspectionSubmitError.textContent = error.message || '검사를 등록하지 못했습니다.';
          inspectionSubmitError.hidden = false;
        } finally {
          inspectionSubmit.disabled = false;
        }
      });

      document.addEventListener('click', (event) => {
        const routeButton = event.target.closest('[data-route]');
        if (routeButton) {
          navigate(routeButton.dataset.route);
          return;
        }
        const link = event.target.closest('a[data-link]');
        if (
          !link ||
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();
        if (!loginBox.hidden) {
          window.location.href = link.href;
          return;
        }

        navigate(link.getAttribute('href'));
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '로그아웃하지 못했습니다.');
          }

          loginForm.reset();
          loginError.textContent = '';
          loginError.hidden = true;
          headerUser.textContent = '';
          headerActions.hidden = true;
          yellowNotice.hidden = true;
          appFooter.hidden = true;
          appScreen.hidden = true;
          loginBox.hidden = false;
        } catch (error) {
          showLoginError(error.message || '로그아웃하지 못했습니다.');
          loginBox.hidden = false;
        } finally {
          logoutButton.disabled = false;
        }
      });

      window.addEventListener('popstate', renderScreen);

      checkLogin();
    </script>
  </body>
</html>
